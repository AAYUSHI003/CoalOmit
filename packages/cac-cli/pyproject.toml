[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cac-cli"
version = "0.1.0"
description = "CLI for Carbon-Aware Compression"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Carbon Lens Authors"}]
dependencies = [
    "cac-core>=0.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
cac = "cac_cli.main:cli"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
