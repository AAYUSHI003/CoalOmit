[project]
name = "carbon-lens"
version = "0.1.0"
description = "Carbon-Aware Compression toolkit for ML models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[tool.pytest.ini_options]
testpaths = ["packages/cac-core/tests", "packages/cac-cli/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
